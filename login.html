<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 1: Login - ExamPrep AI</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./auth.js"></script>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="brand" style="justify-content: center;">🎓 ExamPrep AI</div>
            <h1>Student Login</h1>
            <p class="subtitle">Please log in first to enter the Exam Preparation Portal.</p>

            <div id="authAlert" class="alert-msg"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" placeholder="student@example.com" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn" style="width: 100%; margin-top: 8px;">Log In to Dashboard →</button>
            </form>

            <div class="auth-footer">
                New student? Don't have an account?<br>
                <a href="./signup.html" class="btn btn-outline" style="width: 100%; margin-top: 10px;">Create New Account (Sign Up)</a>
            </div>
        </div>
    </div>

</body>
</html>
