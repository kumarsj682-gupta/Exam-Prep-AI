<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 2: Sign Up - ExamPrep AI</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./auth.js"></script>
</head>
<body>

    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="brand" style="justify-content: center;">🎓 ExamPrep AI</div>
            <h1>Create Student Account</h1>
            <p class="subtitle">Register once to unlock quizzes, flashcards, and study schedules.</p>

            <div id="authAlert" class="alert-msg"></div>

            <form id="signupForm">
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="e.g., Aarav Sharma" required>
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" placeholder="student@example.com" required>
                </div>

                <div class="form-group">
                    <label for="signupStream">Primary Exam Stream</label>
                    <select id="signupStream">
                        <option value="Web Development">Web Development & CS</option>
                        <option value="Science (PCM/PCB)">Science (Physics, Chemistry, Math/Bio)</option>
                        <option value="All Subjects">All Subjects</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password (min 6 characters)</label>
                    <input type="password" id="signupPassword" minlength="6" placeholder="Create a password" required>
                </div>

                <button type="submit" class="btn" style="width: 100%; margin-top: 8px;">Sign Up & Open Dashboard →</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="./login.html">Back to Login</a>
            </div>
        </div>
    </div>

</body>
</html>
